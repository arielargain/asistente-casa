# Va DENTRO del bloque "esphome:" del principio del archivo, justo debajo de
# la linea "friendly_name: Panel de voz". No reemplaza nada: se agrega.
#
# Prioridad 950: el bus I2C ya arranco (prioridad 1000) pero la pantalla y el
# tactil todavia no. Es la unica ventana donde sirve: si el tactil arranca con
# el reset apretado, queda marcado como fallado y no se recupera.
  on_boot:
    - priority: 950
      then:
        - lambda: |-
            // CH422G por I2C directo, como hace el firmware de fabrica.
            // En este chip cada "registro" es una direccion I2C distinta.
            // 0x24 = modo. 0x01 = los ocho IO0-7 pasan a salida, todos juntos:
            // el chip no admite mezclar entradas y salidas en ese banco.
            const uint8_t modo = 0x01;
            id(bus_a)->write(0x24, &modo, 1);
            delay(5);
            // 0x38 = salidas 0-7.
            //   bit 1 -> EXIO1: suelta el reset del tactil
            //   bit 2 -> EXIO2: enciende luz + DISP de la pantalla
            //   bit 4 -> EXIO4: habilita el amplificador
            const uint8_t salidas = (1 << 1) | (1 << 2) | (1 << 4);
            id(bus_a)->write(0x38, &salidas, 1);
            delay(20);
