# ---------------------------------------------------------------------------
# Panel de voz — todo lo que va DESPUES de captive_portal.
# Reemplaza desde la linea "i2c:" hasta el final del archivo.
# NO toques nada de lo que esta arriba de i2c: ahi viven la clave de cifrado,
# la contrasenia de OTA y el wifi.
#
# v10: se le habla al expansor por I2C DIRECTO y el parlante va en el SEGUNDO
# periferico I2S.
#
# EL DATO QUE DESTRABA TODO, de la libreria oficial de Waveshare, en un ejemplo
# escrito para esta placa exacta (ESP32-S3-Touch-LCD-4.3B-BOX):
#
#   "The input/output mode of CH422G's IO0-7 must remain consistent...
#    Using pinMode and multiPinMode will be invalid. You can only set the pin
#    working mode through enableAllIO_Input, enableAllIO_Output..."
#
# Los ocho pines son TODOS entrada o TODOS salida, y fijar el modo pin por pin
# —que es justo lo que hace ESPHome— NO TIENE EFECTO. Por eso ninguna escritura
# movia nada, y por eso la sonda de entrada fue catastrofica: declaraba un pin
# como entrada en un banco que tenia que ser todo salida.
#
# La solucion es saltear el componente y escribirle al chip como hace el
# firmware de fabrica. I2CBus::write() es publico en ESPHome.
#
# LO QUE SE APRENDIO INVESTIGANDO (y corrige varios supuestos anteriores):
#
# 1. El CH422G arranca en modo entrada. Su modo se escribe UNA sola vez, en
#    el setup del expansor, que corre ANTES que los pines que lo usan: cuando
#    se escribe, todavia nadie declaro salidas. Las escrituras posteriores no
#    fallan pero no mueven nada.
#    El rodeo de otras placas (volver a llamar pin->setup()) NO sirve aca:
#    CH422GGPIOPin::setup() esta vacio en el codigo de ESPHome.
#    Lo que SI funciona: read_inputs_() reescribe el modo, y digital_read()
#    es publico. Una sola lectura en el arranque tardio empuja el modo salida.
#    OJO: tiene que ser UNA sola vez. Leer en bucle pone los ocho pines en
#    entrada en cada lectura, y eso dejaba la pantalla apagada.
#
# 2. EXIO2 maneja la luz Y la senial DISP a la vez, asi que alcanza para
#    prender la pantalla. El PWM de brillo (EXIO_PWM) solo sirve para regular
#    y encima pide modificar el hardware: no se usa.
#
# 3. EXIO3 NO es el reset del LCD en la 4.3C — eso venia de la 4.3B. Se saca.
#
# 4. EXIO4 es SD_CS y PA_CTRL a la vez. Como no se usa la tarjeta SD, queda
#    libre para el amplificador.
#
# 5. CORREGIDO: el microfono y el parlante NO pueden compartir el bus I2S en
#    esta version de ESPHome. Se probo quitando el enlace del codec dentro del
#    bloque speaker (como hace la config de referencia) y el error volvio
#    igual. Por eso la bocina de la placa queda afuera hasta que ESPHome
#    soporte duplex, o hasta usar el segundo periferico I2S del S3.
# ---------------------------------------------------------------------------

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: true
    frequency: 400kHz

ch422g:
  - id: expansor

# --------------------------------------------------------------- audio

audio_adc:
  - platform: es7210
    id: mic_adc
    i2c_id: bus_a
    address: 0x40
    bits_per_sample: 16bit
    mic_gain: 18dB
    sample_rate: 16000

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO44
    i2s_mclk_pin: GPIO6

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    # channel: right es obligatorio en esta placa. Con left se graba un canal
    # mudo: no detecta la palabra y el boton tampoco transcribe nada.
    channel: right
    use_apll: true
    bits_per_sample: 16bit
    sample_rate: 16000

# --------------------------------------------------------------- expansor

switch:
  # Apagado: funciona por palabra de activacion, como una bocina comun.
  # Prendido: despues de responder reabre el microfono para contestar sin
  # repetir "okay nabu". Con tope de dos veces seguidas.
  - platform: template
    name: "Conversacion continua"
    id: sw_conversar
    icon: mdi:forum
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: 'return id(conversar);'
    turn_on_action:
      - lambda: 'id(conversar) = true;'
    turn_off_action:
      - lambda: |-
          id(conversar) = false;
          id(seguidas) = 0;

script:
  # ESTA ES LA PIEZA CLAVE. Se le escribe al CH422G por I2C directo, igual que
  # el firmware de fabrica. En este chip cada "registro" es una direccion I2C
  # distinta, por eso van dos escrituras a direcciones diferentes.
  # Le escribe al CH422G por I2C directo Y PUBLICA EL RESULTADO en Home
  # Assistant. Sin esto habia que cazar los mensajes en la ventana de registro
  # justo en el arranque, que es imposible de sincronizar.
  - id: despertar_expansor
    then:
      - lambda: |-
          char buf[160];
          uint8_t modo = 0x01;                                   // banco a salida
          auto e1 = id(bus_a)->write(0x24, &modo, 1);
          delay(5);
          uint8_t salidas = (1 << 1) | (1 << 2) | (1 << 4);      // 0x16
          auto e2 = id(bus_a)->write(0x38, &salidas, 1);
          delay(5);
          uint8_t leido = 0xFF;                                  // leer de vuelta
          auto e3 = id(bus_a)->read(0x26, &leido, 1);
          snprintf(buf, sizeof(buf),
                   "modo=%d salidas=%d lectura=%d valor=0x%02X %s",
                   (int) e1, (int) e2, (int) e3, leido,
                   (e1 == 0 && e2 == 0) ? "-> ACEPTA" : "-> RECHAZA");
          id(diag_expansor).publish_state(buf);
      - delay: 100ms
      - component.update: pantalla

text_sensor:
  - platform: template
    name: "Diagnostico expansor"
    id: diag_expansor
    update_interval: never

  - id: mostrar
    parameters:
      arriba: string
      abajo: string
    then:
      - lambda: |-
          id(mensaje) = arriba;
          id(detalle) = abajo;
      - component.update: pantalla

# --------------------------------------------------------------- pantalla

display:
  - platform: rpi_dpi_rgb
    id: pantalla
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    # Sin reset_pin ni enable_pin: EXIO3 no es el reset en esta variante, y
    # de EXIO2 se encarga el interruptor de arriba, despues de despertar el
    # expansor. Un solo duenio por pin.
    hsync_back_porch: 16
    hsync_front_porch: 16
    hsync_pulse_width: 8
    vsync_back_porch: 16
    vsync_front_porch: 16
    vsync_pulse_width: 8
    data_pins:
      red: [1, 2, 42, 41, 40]
      blue: [14, 38, 18, 17, 10]
      green: [39, 0, 45, 48, 47, 21]
    lambda: |-
      it.fill(Color(12, 14, 20));
      it.printf(400, 190, id(letra_grande), Color(235, 238, 245),
                TextAlign::CENTER, "%s", id(mensaje).c_str());
      it.printf(400, 300, id(letra_chica), Color(120, 130, 150),
                TextAlign::CENTER, "%s", id(detalle).c_str());

touchscreen:
  - platform: gt911
    id: tactil
    i2c_id: bus_a
    display: pantalla
    address: 0x14
    update_interval: 20ms
    interrupt_pin: GPIO4
    # Sin reset_pin: lo suelta el script despertar_expansor por I2C directo.
    on_touch:
      - if:
          condition:
            lambda: 'return !id(va).is_running();'
          then:
            - lambda: 'id(seguidas) = 0;'
            - voice_assistant.start:

font:
  - file: "gfonts://Roboto"
    id: letra_grande
    size: 64
  - file: "gfonts://Roboto"
    id: letra_chica
    size: 28

# --------------------------------------------------------------- estado

globals:
  - id: hubo_voz
    type: bool
    restore_value: no
    initial_value: 'false'
  # Freno de mano del bucle: cuantas veces seguidas reabrio el microfono solo.
  - id: seguidas
    type: int
    restore_value: no
    initial_value: '0'
  # Modo conversacion. Se prende y apaga desde Home Assistant.
  - id: conversar
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: mensaje
    type: std::string
    restore_value: no
    initial_value: '"Okay Nabu"'
  - id: detalle
    type: std::string
    restore_value: no
    initial_value: '"decime eso para hablarme"'

micro_wake_word:
  id: mww
  microphone:
    microphone: mic
    channels: 0
    gain_factor: 1
  models:
    - model: okay_nabu
  vad:
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  noise_suppression_level: 2
  auto_gain: 9dBFS
  volume_multiplier: 1.0

  on_client_connected:
    - micro_wake_word.start:
    - script.execute: despertar_expansor
    - delay: 300ms
    - script.execute:
        id: mostrar
        arriba: "Okay Nabu"
        abajo: "decime eso para hablarme"
  on_client_disconnected:
    - micro_wake_word.stop:

  on_listening:
    - script.execute:
        id: mostrar
        arriba: "Te escucho"
        abajo: "hablame"
    - homeassistant.action:
        action: tts.speak
        data:
          entity_id: tts.piper
          media_player_entity_id: media_player.dormitorio
          message: "Si"
          cache: "true"

  on_stt_end:
    - lambda: 'id(hubo_voz) = true;'
    - script.execute:
        id: mostrar
        arriba: "Pensando"
        abajo: "dame un segundo"
    - homeassistant.action:
        action: tts.speak
        data:
          entity_id: tts.piper
          media_player_entity_id: media_player.dormitorio
          message: "Dale"
          cache: "true"

  on_tts_end:
    # El microfono queda cerrado mientras suena la respuesta.
    - micro_wake_word.stop:
    - homeassistant.action:
        action: media_player.play_media
        data:
          entity_id: media_player.dormitorio
          media_content_type: music
          # SIN announce: el parlante no lo soporta y con respuestas largas
          # descarta el audio, dejando la placa colgada esperando.
        data_template:
          media_content_id: "{{ url }}"
        variables:
          url: !lambda 'return x;'

  on_error:
    - lambda: |-
        id(hubo_voz) = false;
        id(seguidas) = 0;
    - script.execute:
        id: mostrar
        arriba: "No te entendi"
        abajo: "proba de nuevo"

  on_end:
    # Tiempo para que el parlante del dormitorio termine de hablar.
    - delay: 7s
    - if:
        condition:
          lambda: 'return id(conversar) && id(hubo_voz) && id(seguidas) < 2;'
        then:
          - lambda: |-
              id(hubo_voz) = false;
              id(seguidas) += 1;
          - script.execute:
              id: mostrar
              arriba: "Segui"
              abajo: "te sigo escuchando"
          - voice_assistant.start:
        else:
          - lambda: |-
              id(hubo_voz) = false;
              id(seguidas) = 0;
          - script.execute:
              id: mostrar
              arriba: "Okay Nabu"
              abajo: "decime eso para hablarme"
          - micro_wake_word.start:

button:
  - platform: template
    name: "Escuchame ahora"
    id: btn_escuchar
    icon: mdi:microphone
    on_press:
      - voice_assistant.stop:
      - lambda: 'id(seguidas) = 0;'
      - delay: 300ms
      - voice_assistant.start:

  # Por si hace falta re-despertar el expansor sin reiniciar la placa.
  - platform: template
    name: "Despertar expansor"
    id: btn_expansor
    icon: mdi:chip
    on_press:
      - script.execute: despertar_expansor
