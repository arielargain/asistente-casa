# ---------------------------------------------------------------------------
# Panel de voz — todo lo que va DESPUES de captive_portal.
# Reemplaza desde la linea "i2c:" hasta el final del archivo.
# NO toques nada de lo que esta arriba de i2c: ahi viven la clave de cifrado,
# la contrasenia de OTA y el wifi.
#
# v8: los tres frentes juntos, con fundamento.
#
# LO QUE SE APRENDIO INVESTIGANDO (y corrige varios supuestos anteriores):
#
# 1. El CH422G arranca en modo entrada. Su modo se escribe UNA sola vez, en
#    el setup del expansor, que corre ANTES que los pines que lo usan: cuando
#    se escribe, todavia nadie declaro salidas. Las escrituras posteriores no
#    fallan pero no mueven nada.
#    El rodeo de otras placas (volver a llamar pin->setup()) NO sirve aca:
#    CH422GGPIOPin::setup() esta vacio en el codigo de ESPHome.
#    Lo que SI funciona: read_inputs_() reescribe el modo, y digital_read()
#    es publico. Una sola lectura en el arranque tardio empuja el modo salida.
#    OJO: tiene que ser UNA sola vez. Leer en bucle pone los ocho pines en
#    entrada en cada lectura, y eso dejaba la pantalla apagada.
#
# 2. EXIO2 maneja la luz Y la senial DISP a la vez, asi que alcanza para
#    prender la pantalla. El PWM de brillo (EXIO_PWM) solo sirve para regular
#    y encima pide modificar el hardware: no se usa.
#
# 3. EXIO3 NO es el reset del LCD en la 4.3C — eso venia de la 4.3B. Se saca.
#
# 4. EXIO4 es SD_CS y PA_CTRL a la vez. Como no se usa la tarjeta SD, queda
#    libre para el amplificador.
#
# 5. El microfono y el parlante SI pueden compartir un bus I2S. El error era
#    enlazar el codec dentro del bloque speaker: la configuracion de
#    referencia que funciona no lo hace, y ese enlace hacia arrancar la
#    salida apenas prendia la placa, chocando con el microfono.
# ---------------------------------------------------------------------------

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: true
    frequency: 400kHz

ch422g:
  - id: expansor

# --------------------------------------------------------------- audio

audio_adc:
  - platform: es7210
    id: mic_adc
    i2c_id: bus_a
    address: 0x40
    bits_per_sample: 16bit
    mic_gain: 18dB
    sample_rate: 16000

audio_dac:
  - platform: es8311
    id: dac_parlante
    i2c_id: bus_a
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO44
    i2s_mclk_pin: GPIO6

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    # channel: right es obligatorio en esta placa. Con left se graba un canal
    # mudo: no detecta la palabra y el boton tampoco transcribe nada.
    channel: right
    use_apll: true
    bits_per_sample: 16bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: parlante
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO15
    # SIN "audio_dac:" a proposito. La configuracion de referencia que
    # funciona no lo enlaza, y con el enlace la salida arrancaba sola al
    # prender la placa y chocaba con el microfono en el bus compartido.
    dac_type: external
    channel: mono

# --------------------------------------------------------------- expansor

switch:
  # Luz de la pantalla. EXIO2 maneja la luz y el DISP juntos.
  - platform: gpio
    name: "Luz de pantalla"
    id: luz_pantalla
    icon: mdi:television
    restore_mode: ALWAYS_ON
    pin:
      ch422g: expansor
      number: 2
      mode:
        output: true

  # Amplificador del parlante de la placa (PA_CTRL, comparte pin con SD_CS).
  - platform: gpio
    name: "Amplificador"
    id: amplificador
    icon: mdi:volume-high
    restore_mode: ALWAYS_ON
    pin:
      ch422g: expansor
      number: 4
      mode:
        output: true

  # Apagado: funciona por palabra de activacion, como una bocina comun.
  # Prendido: despues de responder reabre el microfono para contestar sin
  # repetir "okay nabu". Con tope de dos veces seguidas.
  - platform: template
    name: "Conversacion continua"
    id: sw_conversar
    icon: mdi:forum
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: 'return id(conversar);'
    turn_on_action:
      - lambda: 'id(conversar) = true;'
    turn_off_action:
      - lambda: |-
          id(conversar) = false;
          id(seguidas) = 0;

script:
  # ESTA ES LA PIEZA CLAVE DE TODO. Una sola lectura del expansor empuja el
  # modo salida al chip; recien despues tiene sentido escribir los pines.
  - id: despertar_expansor
    then:
      - lambda: 'id(expansor)->digital_read(0);'
      - delay: 50ms
      - switch.turn_on: luz_pantalla
      - switch.turn_on: amplificador
      - delay: 100ms
      - component.update: pantalla

  - id: mostrar
    parameters:
      arriba: string
      abajo: string
    then:
      - lambda: |-
          id(mensaje) = arriba;
          id(detalle) = abajo;
      - component.update: pantalla

# --------------------------------------------------------------- pantalla

display:
  - platform: rpi_dpi_rgb
    id: pantalla
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    # Sin reset_pin ni enable_pin: EXIO3 no es el reset en esta variante, y
    # de EXIO2 se encarga el interruptor de arriba, despues de despertar el
    # expansor. Un solo duenio por pin.
    hsync_back_porch: 16
    hsync_front_porch: 16
    hsync_pulse_width: 8
    vsync_back_porch: 16
    vsync_front_porch: 16
    vsync_pulse_width: 8
    data_pins:
      red: [1, 2, 42, 41, 40]
      blue: [14, 38, 18, 17, 10]
      green: [39, 0, 45, 48, 47, 21]
    lambda: |-
      it.fill(Color(12, 14, 20));
      it.printf(400, 190, id(letra_grande), Color(235, 238, 245),
                TextAlign::CENTER, "%s", id(mensaje).c_str());
      it.printf(400, 300, id(letra_chica), Color(120, 130, 150),
                TextAlign::CENTER, "%s", id(detalle).c_str());

touchscreen:
  - platform: gt911
    id: tactil
    i2c_id: bus_a
    display: pantalla
    address: 0x14
    update_interval: 20ms
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: expansor
      number: 1
      mode:
        output: true
    on_touch:
      - if:
          condition:
            lambda: 'return !id(va).is_running();'
          then:
            - lambda: 'id(seguidas) = 0;'
            - voice_assistant.start:

font:
  - file: "gfonts://Roboto"
    id: letra_grande
    size: 64
  - file: "gfonts://Roboto"
    id: letra_chica
    size: 28

# --------------------------------------------------------------- estado

globals:
  - id: hubo_voz
    type: bool
    restore_value: no
    initial_value: 'false'
  # Freno de mano del bucle: cuantas veces seguidas reabrio el microfono solo.
  - id: seguidas
    type: int
    restore_value: no
    initial_value: '0'
  # Modo conversacion. Se prende y apaga desde Home Assistant.
  - id: conversar
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: mensaje
    type: std::string
    restore_value: no
    initial_value: '"Okay Nabu"'
  - id: detalle
    type: std::string
    restore_value: no
    initial_value: '"decime eso para hablarme"'

micro_wake_word:
  id: mww
  microphone:
    microphone: mic
    channels: 0
    gain_factor: 1
  models:
    - model: okay_nabu
  vad:
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  # La respuesta sale por la bocina de la placa. Si esto falla, Ariel igual se
  # entera de que lo escucho: los avisos de abajo van por el parlante del
  # dormitorio, que es el camino verificado.
  speaker: parlante
  noise_suppression_level: 2
  auto_gain: 9dBFS
  volume_multiplier: 1.0

  on_client_connected:
    - micro_wake_word.start:
    - script.execute: despertar_expansor
    - delay: 300ms
    - script.execute:
        id: mostrar
        arriba: "Okay Nabu"
        abajo: "decime eso para hablarme"
  on_client_disconnected:
    - micro_wake_word.stop:

  on_listening:
    - script.execute:
        id: mostrar
        arriba: "Te escucho"
        abajo: "hablame"
    - homeassistant.action:
        action: tts.speak
        data:
          entity_id: tts.piper
          media_player_entity_id: media_player.dormitorio
          message: "Si"
          cache: "true"

  on_stt_end:
    - lambda: 'id(hubo_voz) = true;'
    - script.execute:
        id: mostrar
        arriba: "Pensando"
        abajo: "dame un segundo"
    - homeassistant.action:
        action: tts.speak
        data:
          entity_id: tts.piper
          media_player_entity_id: media_player.dormitorio
          message: "Dale"
          cache: "true"

  on_error:
    - lambda: |-
        id(hubo_voz) = false;
        id(seguidas) = 0;
    - script.execute:
        id: mostrar
        arriba: "No te entendi"
        abajo: "proba de nuevo"

  on_end:
    - delay: 1s
    - if:
        condition:
          lambda: 'return id(conversar) && id(hubo_voz) && id(seguidas) < 2;'
        then:
          - lambda: |-
              id(hubo_voz) = false;
              id(seguidas) += 1;
          - script.execute:
              id: mostrar
              arriba: "Segui"
              abajo: "te sigo escuchando"
          - voice_assistant.start:
        else:
          - lambda: |-
              id(hubo_voz) = false;
              id(seguidas) = 0;
          - script.execute:
              id: mostrar
              arriba: "Okay Nabu"
              abajo: "decime eso para hablarme"
          - micro_wake_word.start:

button:
  - platform: template
    name: "Escuchame ahora"
    id: btn_escuchar
    icon: mdi:microphone
    on_press:
      - voice_assistant.stop:
      - lambda: 'id(seguidas) = 0;'
      - delay: 300ms
      - voice_assistant.start:

  # Por si hace falta re-despertar el expansor sin reiniciar la placa.
  - platform: template
    name: "Despertar expansor"
    id: btn_expansor
    icon: mdi:chip
    on_press:
      - script.execute: despertar_expansor
