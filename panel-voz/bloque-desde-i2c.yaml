# ---------------------------------------------------------------------------
# Panel de voz — todo lo que va DESPUES de captive_portal.
# Reemplaza desde la linea "external_components:" (o "i2c:") hasta el final.
# NO tocar lo de arriba: clave de cifrado, OTA y wifi.
#
# v11: LA PANTALLA, con la receta que funciona en esta placa exacta
# (github.com/lboue/ESPHome_Waveshare_ESP32-S3_Touch_4.3):
#
#   1. El ch422g OFICIAL de ESPHome esta roto para esta placa. Se usa la
#      version del PR #7356 (la original, con address configurable), que es
#      la que la comunidad tiene funcionando.
#   2. Tiempos de video correctos: pclk 14MHz y porches 10/20/10 — los
#      anteriores (16MHz, 16/16/8) eran de la placa hermana 4.3B.
#   3. Se elimina el hack de I2C directo del on_boot: con el componente bueno
#      no hace falta y podria pisarse con el.
#
# El microfono y toda la voz quedan EXACTAMENTE como estaban (funcionando).
# El parlante de la placa sigue afuera (limite del nucleo ESPHome, no de aca).
# ---------------------------------------------------------------------------

external_components:
  # CH422G del PR original (jesterret), copiado a NUESTRO repo para no
  # depender de descargas. La diferencia clave con el componente oficial:
  # antes de cada escritura de salidas toca la direccion 0x24 sin cerrar la
  # transaccion; sin ese saludo el chip rechaza (NACK) todo lo que va a 0x38.
  # El refactor del nucleo perdio ese detalle y por eso la pantalla no andaba.
  - source: github://arielargain/asistente-casa
    components: [ch422g]
    refresh: 0s

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: true
    frequency: 400kHz

ch422g:
  - id: expansor
    i2c_id: bus_a
    address: 0x24

# --------------------------------------------------------------- audio

audio_adc:
  - platform: es7210
    id: mic_adc
    i2c_id: bus_a
    address: 0x40
    bits_per_sample: 16bit
    mic_gain: 18dB
    sample_rate: 16000

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO44
    i2s_mclk_pin: GPIO6

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    # channel: right es obligatorio en esta placa. Con left se graba un canal
    # mudo: no detecta la palabra y el boton tampoco transcribe nada.
    channel: right
    use_apll: true
    bits_per_sample: 16bit
    sample_rate: 16000

# --------------------------------------------------------------- pantalla

display:
  - platform: rpi_dpi_rgb
    id: pantalla
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    # Tiempos de la receta que funciona (lboue): 14MHz y porches 10/20/10.
    pclk_frequency: 14MHz
    pclk_inverted: false
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    reset_pin:
      ch422g: expansor
      number: 3
    enable_pin:
      ch422g: expansor
      number: 2
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    hsync_back_porch: 10
    hsync_front_porch: 20
    hsync_pulse_width: 10
    vsync_back_porch: 10
    vsync_front_porch: 10
    vsync_pulse_width: 10
    data_pins:
      red: [1, 2, 42, 41, 40]
      blue: [14, 38, 18, 17, 10]
      green: [39, 0, 45, 48, 47, 21]
    lambda: |-
      it.fill(Color(12, 14, 20));
      it.printf(400, 190, id(letra_grande), Color(235, 238, 245),
                TextAlign::CENTER, "%s", id(mensaje).c_str());
      it.printf(400, 300, id(letra_chica), Color(120, 130, 150),
                TextAlign::CENTER, "%s", id(detalle).c_str());

touchscreen:
  - platform: gt911
    id: tactil
    display: pantalla
    update_interval: 16ms
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: expansor
      number: 1
    on_touch:
      - if:
          condition:
            lambda: 'return !id(va).is_running();'
          then:
            - lambda: 'id(seguidas) = 0;'
            - voice_assistant.start:

font:
  - file: "gfonts://Roboto"
    id: letra_grande
    size: 64
  - file: "gfonts://Roboto"
    id: letra_chica
    size: 28

switch:
  # Apagado: funciona por palabra de activacion, como una bocina comun.
  # Prendido: despues de responder reabre el microfono para contestar sin
  # repetir "okay nabu". Con tope de dos veces seguidas.
  - platform: template
    name: "Conversacion continua"
    id: sw_conversar
    icon: mdi:forum
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: 'return id(conversar);'
    turn_on_action:
      - lambda: 'id(conversar) = true;'
    turn_off_action:
      - lambda: |-
          id(conversar) = false;
          id(seguidas) = 0;

script:
  - id: mostrar
    parameters:
      arriba: string
      abajo: string
    then:
      - lambda: |-
          id(mensaje) = arriba;
          id(detalle) = abajo;
      - component.update: pantalla

# --------------------------------------------------------------- estado

globals:
  - id: hubo_voz
    type: bool
    restore_value: no
    initial_value: 'false'
  # Freno de mano del bucle: cuantas veces seguidas reabrio el microfono solo.
  - id: seguidas
    type: int
    restore_value: no
    initial_value: '0'
  # Modo conversacion. Se prende y apaga desde Home Assistant.
  - id: conversar
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: mensaje
    type: std::string
    restore_value: no
    initial_value: '"Okay Nabu"'
  - id: detalle
    type: std::string
    restore_value: no
    initial_value: '"decime eso para hablarme"'

micro_wake_word:
  id: mww
  microphone:
    microphone: mic
    channels: 0
    gain_factor: 1
  models:
    # "Okay Nabu": la unica palabra PROBADA con la pronunciacion de Ariel.
    # hey_jarvis esta entrenado en ingles y con su acento no dispara nunca
    # (18 minutos de intentos sin un solo evento). Para evitar que la tablet
    # y la placa se pisen, el cambio de palabra va del lado de la tablet.
    - model: okay_nabu
      probability_cutoff: 0.90
  vad:
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  noise_suppression_level: 2
  auto_gain: 9dBFS
  volume_multiplier: 1.0

  on_client_connected:
    - micro_wake_word.start:
    - delay: 300ms
    - script.execute:
        id: mostrar
        arriba: "Okay Nabu"
        abajo: "decime eso para hablarme"
  on_client_disconnected:
    - micro_wake_word.stop:

  on_listening:
    - script.execute:
        id: mostrar
        arriba: "Te escucho"
        abajo: "hablame"
    - homeassistant.action:
        action: tts.speak
        data:
          entity_id: tts.home_assistant_cloud
          media_player_entity_id: media_player.dormitorio
          message: "Te escucho"
          cache: "true"

  on_stt_end:
    - lambda: 'id(hubo_voz) = true;'
    - script.execute:
        id: mostrar
        arriba: "Pensando"
        abajo: "dame un segundo"
    - homeassistant.action:
        action: tts.speak
        data:
          entity_id: tts.home_assistant_cloud
          media_player_entity_id: media_player.dormitorio
          message: "Okey"
          cache: "true"

  on_tts_end:
    # El microfono queda cerrado mientras suena la respuesta.
    - micro_wake_word.stop:
    # DESPERTAR EL PARLANTE PRIMERO. Probado: play_media a un Google apagado
    # no lo despierta y el audio muere en silencio, sin error. tts.speak si lo
    # despierta, pero aca tenemos una URL, no texto. turn_on + espera resuelve.
    - homeassistant.action:
        action: media_player.turn_on
        data:
          entity_id: media_player.dormitorio
    - delay: 1200ms
    - homeassistant.action:
        action: media_player.play_media
        data:
          entity_id: media_player.dormitorio
          media_content_type: music
          # SIN announce: el parlante no lo soporta y con respuestas largas
          # descarta el audio, dejando la placa colgada esperando.
        data_template:
          media_content_id: "{{ url }}"
        variables:
          url: !lambda 'return x;'

  on_error:
    - lambda: |-
        id(hubo_voz) = false;
        id(seguidas) = 0;
    - script.execute:
        id: mostrar
        arriba: "No te entendi"
        abajo: "proba de nuevo"

  on_end:
    # Bajado de 7s a 4s: la deteccion de fin de habla esta en aggressive y la
    # respuesta ya no se cuelga esperando reproducciones fantasma.
    - delay: 4s
    - if:
        condition:
          lambda: 'return id(conversar) && id(hubo_voz) && id(seguidas) < 2;'
        then:
          - lambda: |-
              id(hubo_voz) = false;
              id(seguidas) += 1;
          - script.execute:
              id: mostrar
              arriba: "Segui"
              abajo: "te sigo escuchando"
          - voice_assistant.start:
        else:
          - lambda: |-
              id(hubo_voz) = false;
              id(seguidas) = 0;
          - script.execute:
              id: mostrar
              arriba: "Okay Nabu"
              abajo: "decime eso para hablarme"
          - micro_wake_word.start:

button:
  - platform: template
    name: "Escuchame ahora"
    id: btn_escuchar
    icon: mdi:microphone
    on_press:
      - voice_assistant.stop:
      - lambda: 'id(seguidas) = 0;'
      - delay: 300ms
      - voice_assistant.start:

